<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVITM Command Center — Interactions Explorer</title>
    <script>
        const token = sessionStorage.getItem('rvitm_admin_token');
        if (!token) window.location.href = 'login.html';
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #071520;
            --bg-sidebar: rgba(12, 38, 53, 0.9);
            --bg-card: rgba(12, 38, 53, 0.6);
            --border: rgba(94, 234, 212, 0.12);
            --primary: #9aff78;
            --secondary: #5eead4;
            --accent-green: #61ce70;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .mesh-bg {
            position: fixed; inset: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(154, 255, 120, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(94, 234, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0c2635 0%, #071520 100%);
            z-index: -1;
        }

        /* --- Sidebar --- */
        aside {
            width: 260px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(24px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 18px;
            z-index: 10;
        }

        .logo-area {
            display: flex; align-items: center; gap: 12px; margin-bottom: 36px; padding-left: 6px;
        }
        .logo-img {
            width: 42px; height: 42px; border-radius: 50%; background: #fff; padding: 3px;
            border: 2px solid var(--primary);
        }
        .logo-text h2 { font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 800; }
        .logo-text p { font-size: 10px; color: var(--primary); font-weight: 700; text-transform: uppercase; }

        .nav-links { list-style: none; flex-grow: 1; }
        .nav-item {
            padding: 12px 14px; border-radius: 12px; cursor: pointer; margin-bottom: 6px;
            display: flex; align-items: center; gap: 12px; color: var(--text-dim);
            font-size: 13.5px; font-weight: 600; transition: all 0.2s; text-decoration: none;
        }
        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        .nav-item.active {
            background: rgba(154, 255, 120, 0.12); color: var(--primary);
            border: 1px solid rgba(154, 255, 120, 0.25);
        }
        .nav-item svg { width: 18px; height: 18px; opacity: 0.85; }

        .user-footer {
            padding-top: 18px; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .logout-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; }
        .logout-btn:hover { color: var(--danger); }

        /* --- Main Content --- */
        main {
            flex-grow: 1; padding: 28px 36px; overflow-y: auto; display: flex; flex-direction: column;
        }

        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
        }
        .page-title h1 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; }
        .page-title p { font-size: 13px; color: var(--text-dim); }

        /* --- Filter Controls --- */
        .controls-card {
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 16px 20px; margin-bottom: 24px;
            display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
        }

        .search-box {
            flex-grow: 1; min-width: 260px;
            position: relative;
        }
        .search-input {
            width: 100%; padding: 10px 14px 10px 38px;
            background: rgba(7, 21, 32, 0.7); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text-main); font-size: 13.5px; outline: none;
        }
        .search-input:focus { border-color: var(--primary); }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; color: var(--text-dim); pointer-events: none;
        }

        .filter-select {
            padding: 10px 14px; background: rgba(7, 21, 32, 0.7);
            border: 1px solid var(--border); border-radius: 10px;
            color: var(--text-main); font-size: 13px; outline: none;
        }

        .action-btn {
            padding: 10px 16px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 10px;
            color: var(--text-main); font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* --- Transcripts Grid --- */
        .log-container {
            flex-grow: 1; background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 18px;
            padding: 20px; overflow-y: auto;
        }

        .log-item {
            background: rgba(7, 21, 32, 0.6); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px 20px; margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        .log-item:hover { border-color: rgba(154, 255, 120, 0.35); }

        .log-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }

        .log-sid {
            font-size: 11.5px; color: var(--text-dim); font-family: monospace;
        }

        .intent-badge {
            display: inline-block; padding: 4px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600; background: rgba(154, 255, 120, 0.12);
            color: var(--primary); border: 1px solid rgba(154, 255, 120, 0.25);
        }

        .user-bubble {
            background: rgba(12, 38, 53, 0.9); border-left: 3px solid var(--primary);
            padding: 10px 14px; border-radius: 0 10px 10px 0; margin-bottom: 8px;
            font-size: 13.5px;
        }

        .meta-row {
            display: flex; gap: 16px; font-size: 11px; color: var(--text-dim); margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <aside>
        <div class="logo-area">
            <img src="../rvitm_logo.png" alt="RVITM Logo" class="logo-img">
            <div class="logo-text">
                <h2>RVITM Admin</h2>
                <p>Command Center</p>
            </div>
        </div>

        <ul class="nav-links">
            <li><a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Overview
            </a></li>
            <li><a href="interactions.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Interactions Log
            </a></li>
            <li><a href="sessions.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Sessions Auditor
            </a></li>
            <li><a href="analytics.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                Deep Analytics
            </a></li>
            <li><a href="../" target="_blank" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                Live Bot Preview ↗
            </a></li>
        </ul>

        <div class="user-footer">
            <span style="font-size: 12px; color: var(--text-dim);">admin@rvitm</span>
            <button class="logout-btn" onclick="logout()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </aside>

    <main>
        <header>
            <div class="page-title">
                <h1>Conversational Interactions Explorer</h1>
                <p>Complete transcript history, sentiment patterns, and NLP categorization</p>
            </div>
            <div>
                <button class="action-btn" onclick="loadInteractions()">↻ Refresh</button>
            </div>
        </header>

        <div class="controls-card">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search keywords (e.g. placements, CSE, library)..." oninput="filterLogs()">
            </div>
            <select id="toneFilter" class="filter-select" onchange="filterLogs()">
                <option value="all">All Tones</option>
                <option value="pro">Professional 🎓</option>
                <option value="funny">Friendly 😄</option>
            </select>
        </div>

        <div class="log-container" id="logContainer">
            <!-- Populated dynamically -->
        </div>
    </main>

    <script>
        let allLogs = [];

        function logout() {
            sessionStorage.removeItem('rvitm_admin_token');
            window.location.href = 'login.html';
        }

        async function loadInteractions() {
            try {
                const res = await fetch('/api/interactions-data', {
                    headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('rvitm_admin_token') }
                });
                if (res.status === 401 || res.status === 403) return logout();
                allLogs = await res.json();
                filterLogs();
            } catch (e) {
                console.error(e);
            }
        }

        function filterLogs() {
            const query = (document.getElementById('searchInput').value || '').toLowerCase();
            const tone = document.getElementById('toneFilter').value;

            const filtered = allLogs.filter(l => {
                const qText = (l.data.query || '').toLowerCase();
                const intent = (l.data.intentId || '').toLowerCase();
                const matchesQ = !query || qText.includes(query) || intent.includes(query);
                const matchesTone = tone === 'all' || l.data.tone === tone;
                return matchesQ && matchesTone;
            });

            renderLogs(filtered);
        }

        function renderLogs(logs) {
            const cont = document.getElementById('logContainer');
            cont.innerHTML = '';
            if (!logs.length) {
                cont.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 40px;">No interactions match criteria.</div>';
                return;
            }

            logs.forEach(item => {
                const div = document.createElement('div');
                div.className = 'log-item';
                const time = new Date(item.timestamp).toLocaleString();
                div.innerHTML = `
                    <div class="log-header">
                        <span class="intent-badge">${escapeHtml(item.data.intentId || 'general')}</span>
                        <span class="log-sid">${escapeHtml(item.data.sessionId || 'anonymous')} · ${time}</span>
                    </div>
                    <div class="user-bubble">
                        💬 <strong>User:</strong> "${escapeHtml(item.data.query || '(empty)')}"
                    </div>
                    <div class="meta-row">
                        <span>Tone: <strong>${item.data.tone === 'funny' ? 'Friendly' : 'Professional'}</strong></span>
                        <span>Matching: <strong>${item.data.matchedType || 'Direct'}</strong></span>
                        <span>Client: <strong>${escapeHtml((item.data.clientUserAgent || '').substring(0, 45))}...</strong></span>
                    </div>
                `;
                cont.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s]);
        }

        loadInteractions();
    </script>
</body>
</html>
