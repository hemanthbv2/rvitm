<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVITM Command Center — Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #071520;
            --bg-card: rgba(12, 38, 53, 0.7);
            --border: rgba(94, 234, 212, 0.15);
            --primary: #9aff78;
            --primary-hover: #b4ff9a;
            --secondary: #5eead4;
            --accent-green: #61ce70;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .mesh-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(154, 255, 120, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(94, 234, 212, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0c2635 0%, #071520 100%);
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(154, 255, 120, 0.08);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .logo-img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
            padding: 4px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(154, 255, 120, 0.3);
        }

        .logo-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
        }

        .logo-title p {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .title-desc {
            font-size: 13.5px;
            color: var(--text-dim);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(7, 21, 32, 0.7);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(154, 255, 120, 0.2);
            background: rgba(7, 21, 32, 0.9);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #071520;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(154, 255, 120, 0.35);
        }

        .hint-badge {
            margin-top: 24px;
            padding: 12px 14px;
            background: rgba(154, 255, 120, 0.08);
            border: 1px solid rgba(154, 255, 120, 0.2);
            border-radius: 10px;
            font-size: 11.5px;
            color: var(--primary);
            text-align: center;
        }

        .alert-error {
            display: none;
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 12.5px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <div class="login-card">
        <div class="logo-wrap">
            <img src="../rvitm_logo.png" alt="RVITM Logo" class="logo-img">
            <div class="logo-title">
                <h1>RVITM Command</h1>
                <p>Telemetry Analytics</p>
            </div>
        </div>

        <p class="title-desc">Sign in with administrator credentials to monitor live conversations, sentiment, and telemetry streams.</p>

        <div id="errorAlert" class="alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Admin Username</label>
                <input type="text" id="username" class="form-input" value="admin" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Security Password</label>
                <input type="password" id="password" class="form-input" value="admin@rvitm" required>
            </div>

            <button type="submit" id="loginBtn" class="btn-submit">
                <span>Access Command Center</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="hint-badge">
            Default Demo Credentials: <strong>admin</strong> / <strong>admin@rvitm</strong>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const err = document.getElementById('errorAlert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            err.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success && data.token) {
                    sessionStorage.setItem('rvitm_admin_token', data.token);
                    sessionStorage.setItem('rvitm_admin_user', data.user.username);
                    window.location.href = 'index.html';
                } else {
                    err.textContent = data.message || 'Authentication failed. Please verify credentials.';
                    err.style.display = 'block';
                }
            } catch (error) {
                err.textContent = 'Server connection error. Ensure server.js is running on port 3008.';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
